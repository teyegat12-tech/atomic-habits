<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Курс-квест по книге Джеймса Клира «Атомные привычки»: 21 урок, задания, трекер и дневник.">
<title>Атомные привычки · курс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sage page → rounded light shell; dark icon rail on the left (bottom bar on phones); big grotesk headline with inline chips; white cards, one lime card, one dark card; segmented capsule progress. */
:root{
  --page:#DCDDE0; --shell:#F4F4F5; --card:#FFFFFF; --ink:#131316; --mut:#7C7D84; --line:#E4E4E8;
  --lime:#E4F48B; --lime-ink:#121412; --dark:#151716; --dark-ink:#F3F5F1; --ok:#3F8F5A; --no:#C0473F;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px; --r-s:14px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font:500 15px/1.55 var(--f);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:16px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.shell{max-width:1240px;margin:0 auto;background:var(--shell);border-radius:32px;display:grid;grid-template-columns:72px 1fr;gap:20px;padding:14px;min-height:calc(100vh - 32px)}
.rail{background:var(--dark);border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:14px;position:sticky;top:14px;height:calc(100vh - 60px);max-height:760px}
.rail .logo{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;margin-bottom:14px;color:var(--dark-ink);font-weight:800;font-size:14px}
.rail button{width:44px;height:44px;border-radius:14px;border:none;background:transparent;color:rgba(243,245,241,.55);display:grid;place-items:center;cursor:pointer;position:relative}
.rail button:hover{color:var(--dark-ink);background:rgba(255,255,255,.06)}
.rail button.on{background:rgba(255,255,255,.14);color:var(--dark-ink)}
.rail button .tip{position:absolute;left:54px;background:var(--dark);color:var(--dark-ink);font-size:12px;padding:4px 8px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.rail button:hover .tip{opacity:1}
.rail .sp{flex:1}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{min-width:0;padding:10px 6px 30px}

/* headline */
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hl{font-size:clamp(30px,4.6vw,52px);font-weight:600;line-height:1.08;letter-spacing:-.03em;margin:0;max-width:16em;text-wrap:balance}
.hl .chip{display:inline-grid;place-items:center;width:1.05em;height:.72em;border-radius:99px;background:var(--card);vertical-align:.08em;margin:0 .12em}
.hl .chip.l{background:var(--lime)}
.hl .chip svg{width:.38em;height:.38em}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:99px;border:none;cursor:pointer;padding:11px 18px;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none}
.pill.dark{background:var(--dark);color:var(--dark-ink)}
.pill.light{background:var(--card);color:var(--ink)}
.pill.lime{background:var(--lime);color:var(--lime-ink)}
.pill.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.pill:disabled{opacity:.4;cursor:not-allowed}
.pill .ic{width:16px;height:16px}
.round{width:42px;height:42px;border-radius:50%;background:var(--card);border:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.tabs button{border:none;cursor:pointer;background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600}
.tabs button.on{background:var(--dark);color:var(--dark-ink)}
.sub{color:var(--mut);margin:10px 0 0;max-width:62ch}

/* grids */
.dash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,.9fr);gap:12px;margin-top:18px}
.card{background:var(--card);border-radius:var(--r);padding:18px;min-width:0}
.card.lime{background:var(--lime);color:var(--lime-ink)}
.card.dark{background:var(--dark);color:var(--dark-ink)}
.ch{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.ch .t{display:flex;align-items:center;gap:8px}
.ch .ib{width:30px;height:30px;border-radius:50%;background:var(--shell);display:grid;place-items:center}
.card.lime .ib{background:rgba(255,255,255,.55)}
.card.dark .ib{background:rgba(255,255,255,.1)}
.num{font-size:52px;font-weight:600;letter-spacing:-.04em;line-height:1;margin-top:22px;font-variant-numeric:tabular-nums;display:flex;align-items:flex-start;gap:8px}
.num small{font-size:13px;letter-spacing:0;font-weight:600;color:var(--mut);margin-top:22px}
.card.lime .num small{color:rgba(18,20,18,.55)}
.badge{font-size:11px;font-weight:700;background:var(--lime);color:var(--lime-ink);padding:3px 7px;border-radius:99px;letter-spacing:0}
.card.lime .badge{background:#fff}
.segs{display:flex;gap:4px;margin-top:14px}
.segs i{flex:1;height:34px;border-radius:99px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.segs i.on{background:var(--ink);box-shadow:none}
.card.lime .segs i{box-shadow:inset 0 0 0 1.5px rgba(18,20,18,.2)}
.card.lime .segs i.on{background:var(--lime-ink)}
.segs.thin i{height:10px}
.side{display:grid;gap:12px;grid-row:span 2;align-content:start}
.mini{background:var(--card);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer;border:none;text-align:left;width:100%}
.mini b{font-size:14px}
.mini span{font-size:12px;color:var(--mut);grid-column:1}
.mini .ic{grid-row:1/span 2;grid-column:2;align-self:start;color:var(--mut)}
.mini.two{grid-template-columns:1fr 1fr;gap:10px;background:transparent;padding:0;cursor:default}
.mini.two button{background:var(--card);border:none;border-radius:var(--r);padding:16px 10px;display:grid;justify-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
.mini.two .ib{width:34px;height:34px;border-radius:50%;background:var(--shell);display:grid;place-items:center}
.quote-card{display:flex;flex-direction:column;gap:14px;justify-content:space-between;min-height:220px;position:relative;overflow:hidden}
.quote-card q{font-size:21px;line-height:1.25;font-weight:600;letter-spacing:-.01em;quotes:"«" "»";position:relative}
.quote-card cite{font-style:normal;font-size:12px;opacity:.6;position:relative}
.quote-card canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.quote-card .pill{align-self:flex-start;position:relative}
.span2{grid-column:span 2}.span3{grid-column:span 3}
@media (max-width:1080px){.dash{grid-template-columns:repeat(2,minmax(0,1fr))}.side{grid-row:auto;grid-column:span 2;grid-template-columns:repeat(2,minmax(0,1fr))}.span3{grid-column:span 2}}
@media (max-width:640px){.dash{grid-template-columns:1fr}.side{grid-column:auto;grid-template-columns:1fr}.span2,.span3{grid-column:auto}}

/* stats chart */
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:16px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart b{width:100%;max-width:30px;border-radius:99px;background:var(--shell);display:block}
.chart b.on{background:var(--ink)}
.chart b.today{background:var(--lime);box-shadow:inset 0 0 0 1.5px var(--ink)}
.chart span{font-size:10px;color:var(--mut)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:5px}
.legend i.l{background:var(--lime);box-shadow:inset 0 0 0 1px var(--ink)}

/* course map */
.mods{display:grid;gap:12px;margin-top:18px}
.mod{background:var(--card);border-radius:var(--r);padding:18px}
.mod-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mod-h h3{margin:0;font-size:18px;letter-spacing:-.01em}
.mod-h .mut{font-size:13px;color:var(--mut)}
.les-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:14px}
.les{border:none;background:var(--shell);border-radius:var(--r-s);padding:14px;text-align:left;cursor:pointer;display:grid;gap:6px;min-width:0}
.les:disabled{cursor:default;opacity:.55}
.les .top2{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)}
.les b{font-size:15px;line-height:1.25}
.les .state{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--card);color:var(--mut)}
.les.done{background:var(--dark);color:var(--dark-ink)}
.les.done .top2{color:rgba(243,245,241,.6)}
.les.done .state{background:rgba(255,255,255,.12);color:var(--dark-ink)}
.les.cur{background:var(--lime);color:var(--lime-ink)}
.les.cur .top2{color:rgba(18,20,18,.6)}

/* lesson */
.crumbs{display:flex;gap:6px;flex-wrap:wrap}
.crumbs span{background:var(--card);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700}
.crumbs span.l{background:var(--lime)}
.lgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-top:18px;align-items:start}
.lgrid .col{display:grid;gap:12px;min-width:0}
@media (max-width:900px){.lgrid{grid-template-columns:1fr}}
.steps{display:flex;gap:4px;margin-top:12px}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--ink)}
.sec-t{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
.sec-t .n{width:28px;height:28px;border-radius:50%;background:var(--shell);display:grid;place-items:center;font-size:12px}
.sec-t .n.ok{background:var(--ink);color:var(--card)}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ideas li{background:var(--shell);border-radius:var(--r-s);padding:12px 14px}
.ideas li b{display:block;margin-bottom:3px;font-size:15px}
.ideas li p{margin:0;color:var(--ink);opacity:.82}
.formula{background:var(--card);border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.q+.q{margin-top:16px}
.q b{display:block;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opts button{text-align:left;padding:11px 14px;border:none;border-radius:99px;background:var(--shell);cursor:pointer;font-weight:600;font-size:14px}
.opts button.right{background:var(--ink);color:var(--card)}
.opts button.wrong{box-shadow:inset 0 0 0 1.5px var(--no);color:var(--no)}
.fb{font-size:13px;margin-top:6px;color:var(--mut)}
label.f{display:block;margin-top:12px;font-size:13px;font-weight:600;color:var(--mut)}
label.f:first-child{margin-top:0}
input[type=text],textarea{display:block;width:100%;margin-top:5px;background:var(--shell);border:1.5px solid transparent;border-radius:var(--r-s);padding:11px 14px;color:var(--ink);font-weight:500}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--ink);flex:none}
.req{display:grid;gap:6px;font-size:14px;margin-top:12px}
.req span{display:flex;gap:8px;align-items:center;opacity:.6}
.req span.ok{opacity:1}
.req span i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;display:grid;place-items:center;font-style:normal;font-size:11px}
.req span.ok i{background:var(--lime-ink);color:var(--lime);box-shadow:none}
.sc-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sc-row span{min-width:0;overflow-wrap:anywhere}
.rate{display:flex;gap:4px}
.rate button{width:34px;height:30px;border:none;background:var(--shell);border-radius:99px;cursor:pointer;font-weight:700}
.rate button.on[data-v="+"]{background:var(--ok);color:#fff}
.rate button.on[data-v="−"]{background:var(--no);color:#fff}
.rate button.on[data-v="="]{background:var(--ink);color:var(--card)}
.x{border:none;background:none;color:var(--mut);font-size:18px;cursor:pointer;width:26px}
.row2{display:flex;gap:6px;margin-top:10px}
.row2 input{margin-top:0}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.lock{background:var(--card);border-radius:var(--r);padding:18px;color:var(--mut);margin-top:12px}

/* tracker + journal */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:460px;margin-top:14px}
.cal div{aspect-ratio:1;border-radius:12px;background:var(--shell);display:grid;place-items:center;font-size:12px;color:var(--mut);font-weight:600}
.cal div.on{background:var(--ink);color:var(--card)}
.cal div.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal div.on.today{background:var(--lime);color:var(--lime-ink)}
.jentry+.jentry{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.jentry h3{margin:0 0 6px;font-size:16px}
.jentry dt{font-size:12px;color:var(--mut);margin-top:8px;font-weight:600}
.jentry dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}

/* reader */
.reader{position:fixed;inset:0;z-index:30;background:var(--shell);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.reader[hidden]{display:none}
.reader-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px}
.reader-b{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.reader-b canvas{background:#fff;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12);max-width:100%}
.plab{font-size:12px;color:var(--mut);margin-top:10px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--dark-ink);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* phone: rail becomes bottom bar */
@media (max-width:720px){
  body{padding-inline:10px;padding-block:10px 90px}
  .shell{grid-template-columns:1fr;border-radius:24px;padding:12px}
  .rail{position:fixed;left:10px;right:10px;top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:auto;flex-direction:row;justify-content:space-around;padding:8px;z-index:20;max-height:none}
  .rail .logo,.rail .sp,.rail .tip{display:none}
  main{padding:4px 2px 20px}
}
</style>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Разделы"></nav>
  <main id="view"></main>
</div>
<div class="reader" id="reader" hidden><div class="reader-h"><b id="readerTitle"></b><button class="pill dark" type="button" id="readerClose">Закрыть</button></div><div class="reader-b" id="readerBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ============ CONTENT ============ */
/* Пересказ идей книги своими словами. Истории и исследования — в самой книге. */
const MODULES=[
 {id:'m1',title:'Модуль 1. Фундамент',sub:'Как на самом деле устроены привычки'},
 {id:'m2',title:'Модуль 2. Закон 1 — сделай очевидным',sub:'Стимул'},
 {id:'m3',title:'Модуль 3. Закон 2 — сделай привлекательным',sub:'Желание'},
 {id:'m4',title:'Модуль 4. Закон 3 — сделай простым',sub:'Реакция'},
 {id:'m5',title:'Модуль 5. Закон 4 — сделай приятным',sub:'Награда'},
 {id:'m6',title:'Модуль 6. Мастерство',sub:'Как не застрять и расти дальше'}
];
const LESSONS=[
/* ---- M1 ---- */
{mod:'m1',ch:'Глава 1',title:'Сила 1%',
 intro:'Почему маленькие изменения почти не видны сначала и дают огромный результат потом.',
 ideas:[
  ['Сложный процент','Если становиться лучше на 1% в день, через год выйдет примерно в 37 раз лучше. Если хуже на 1% — почти ноль. Разница в моменте незаметна, а на дистанции огромна.'],
  ['Работает в обе стороны','Полезные привычки копят знания, здоровье, отношения. Вредные так же тихо копят стресс, долги и усталость. Смотри на траекторию, а не на сегодняшнюю точку.'],
  ['Скрытый потенциал','Мы ждём, что результат будет расти ровно вслед за усилиями. На деле сначала долго «ничего не происходит», а потом резкий скачок. Большинство бросает как раз на этом плато.'],
  ['Системы важнее целей','Цель — это результат, который хочешь. Система — ежедневный процесс, который к нему ведёт. У победителей и проигравших часто одни и те же цели. Разница в системах.'],
  ['Минусы целей','Цель — это один момент: достиг, и мотивация пропадает. Она откладывает счастье на «потом, когда…». А ещё она заставляет думать «или успех, или провал», хотя путей много.'],
  ['Атомная привычка','Маленькое регулярное действие, которое само по себе мелочь, но встроено в систему. Как атом: крошечный, но из таких собирается всё.']
 ],
 quiz:[
  {q:'Что по книге сильнее всего определяет результат на длинной дистанции?',o:['Амбициозная цель','Система ежедневных действий','Сила мотивации'],a:1,e:'Цель задаёт направление, а двигает система.'},
  {q:'Ты занимаешься месяц, а результата не видно. Что это, скорее всего?',o:['Метод не работает','Плато скрытого потенциала','Нужна новая цель'],a:1,e:'Усилия копятся до точки, где результат становится заметен.'}
 ],
 task:{title:'Преврати цель в систему',text:'Возьми одну свою цель и опиши, какие регулярные действия к ней ведут.',fields:[
  {id:'goal',l:'Моя цель',ph:'например: вести блог и набрать аудиторию'},
  {id:'system',l:'Моя система (что делаю каждый день или неделю)',ph:'например: 20 минут на пост каждый день, публикация по вторникам и пятницам',area:1}]},
 life:'Сделай сегодня одно маленькое действие из своей системы.',
 reflect:'Где ты бросала что-то, потому что «не видно результата»?'},

{mod:'m1',ch:'Глава 2',title:'Привычки и идентичность',
 intro:'Устойчивые изменения начинаются не с того, чего ты хочешь добиться, а с того, кем хочешь быть.',
 ideas:[
  ['Три слоя изменений','Результат (что получаешь), процесс (что делаешь) и идентичность (во что веришь про себя). Обычно начинают с результата. Надёжнее — изнутри, с идентичности.'],
  ['Поведение следует за образом себя','Если привычка противоречит тому, как ты себя видишь, она не приживётся. «Я пытаюсь бросить курить» и «я не курю» — это два разных человека.'],
  ['Каждое действие — голос','Каждый раз, когда ты что-то делаешь, ты голосуешь за определённого себя. Единогласие не нужно, нужно большинство голосов.'],

/* ============ BOOK (свой PDF, хранится только в этом браузере) ============ */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js';
const PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
let BOOK=null, DOC=null; // BOOK={name,buf}
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('atomic-book',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbGet(){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('files').objectStore('files').get('book');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbSet(v){try{const db=await idb();await new Promise(r=>{const tx=db.transaction('files','readwrite');v?tx.objectStore('files').put(v,'book'):tx.objectStore('files').delete('book');tx.oncomplete=r;tx.onerror=r})}catch(e){}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
async function getPdfjs(){if(window.pdfjsLib&&window.pdfjsWorker)return window.pdfjsLib;await loadScript(PDFW);await loadScript(PDFJS);window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;return window.pdfjsLib}
async function getDoc(){if(DOC)return DOC;if(!BOOK)return null;const lib=await getPdfjs();DOC=await lib.getDocument({data:new Uint8Array(BOOK.buf.slice(0))}).promise;return DOC}
async function setBook(file){const buf=await file.arrayBuffer();BOOK={name:file.name,buf};DOC=null;await idbSet(BOOK)}

async function openReader(i){
  const r=$('reader'),body=$('readerBody'),[s,e]=PAGES[i],off=Number(S.offset??1);
  $('readerTitle').textContent=`${LESSONS[i].ch} · стр. ${s}–${e}`;
  r.hidden=false;document.body.style.overflow='hidden';body.innerHTML='<p class="mut">Открываю книгу…</p>';
  try{
    const doc=await getDoc();body.innerHTML='';
    const w=Math.min(body.clientWidth-8,760),dpr=window.devicePixelRatio||1;
    for(let p=s;p<=e;p++){
      const n=p+off;if(n<1||n>doc.numPages)continue;
      const page=await doc.getPage(n),v1=page.getViewport({scale:1}),sc=w/v1.width,vp=page.getViewport({scale:sc*dpr});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=w+'px';c.style.height=(vp.height/dpr)+'px';
      const lab=document.createElement('div');lab.className='plab';lab.textContent='стр. '+p;
      body.appendChild(lab);body.appendChild(c);
      if(r.hidden)return;
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
    const end=document.createElement('div');end.className='plab';end.innerHTML=`Конец главы. <button class="btn pri" type="button" data-readdone="${i}">Отметить: прочитала</button>`;body.appendChild(end);
  }catch(err){body.innerHTML='<p>Не получилось открыть книгу. Проверь, что выбран PDF, или загрузи файл заново в «Настройках».</p>'}
}
function closeReader(){$('reader').hidden=true;$('readerBody').innerHTML='';document.body.style.overflow=''}

const KEY='atomic-course-proto-v1';
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dk(new Date());
let S={done:{},ans:{},quiz:{},life:{},read:{},sc:[],trk:{},free:false,offset:1,tab:'home',cur:0,modf:'all',start:today()};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.read)S.read={};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function unlock(i){
  if(i===0) return {open:true};
  const prev=S.done[i-1];
  if(!prev) return {open:false,reason:'после предыдущего'};
  if(S.free||S.done[i]) return {open:true};
  if(prev<today()) return {open:true};
  return {open:false,reason:'откроется завтра'};
}
const doneCount=()=>Object.keys(S.done).length;
function nextIdx(){for(let i=0;i<LESSONS.length;i++) if(!S.done[i]) return i; return LESSONS.length-1}
function xp(){let x=doneCount()*50;Object.values(S.quiz).forEach(v=>{if(v&&v.ok)x+=10});x+=Object.keys(S.trk).length*5;x+=Object.values(S.read).filter(Boolean).length*20;return x}
const XP_MAX=LESSONS.length*50+LESSONS.reduce((a,l)=>a+l.quiz.length*10,0)+LESSONS.length*20;
function streak(){let n=0;const d=new Date();if(!S.trk[dk(d)])d.setDate(d.getDate()-1);while(S.trk[dk(d)]){n++;d.setDate(d.getDate()-1)}return n}

}

/* ============ RENDER ============ */
function dots(){const c=$('dots');if(!c)return;const w=c.clientWidth,h=c.clientHeight,dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  // 1% growth curve drawn as dots
  for(let i=0;i<=60;i++){const t=i/60,px=w*.08+t*w*.9,v=(Math.pow(1.01,t*365)-1)/36.8,py=h*.95-v*h*.8;x.beginPath();x.arc(px,py,1.6+t*1.6,0,7);x.fillStyle=`rgba(228,244,139,${.25+t*.6})`;x.fill()}}
function render(){
  renderRail();
  const v={home:vHome,course:vCourse,lesson:vLesson,tracker:vTracker,journal:vJournal,settings:vSettings}[S.tab]||vHome;
  $('view').innerHTML=v();dots();
}
const keep=f=>{const y=scrollY;f();render();scrollTo(0,y)};

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){go(tb.dataset.tab);return}
  const o=e.target.closest('[data-open]');
  if(o&&!o.disabled){S.cur=+o.dataset.open;S.tab='lesson';save();render();scrollTo(0,0);return}
  const mg=e.target.closest('[data-modgo]');if(mg){S.modf=mg.dataset.modgo;go('course');return}
  const mf=e.target.closest('[data-modf]');if(mf){S.modf=mf.dataset.modf;save();keep(()=>{});return}
  const q=e.target.closest('[data-q]');
  if(q){const [i,k]=q.dataset.q.split('_').map(Number),j=+q.dataset.j,ok=LESSONS[i].quiz[k].a===j;keep(()=>{S.quiz[q.dataset.q]={pick:j,ok};save()});if(ok)toast('+10 XP');return}
  const sc=e.target.closest('[data-sc]');if(sc){keep(()=>{S.sc[+sc.dataset.sc].v=sc.dataset.v;save()});return}
  const sd=e.target.closest('[data-scdel]');if(sd){keep(()=>{S.sc.splice(+sd.dataset.scdel,1);save()});return}
  if(e.target.closest('[data-trk-today]')){const t=today();keep(()=>{if(S.trk[t])delete S.trk[t];else S.trk[t]=1;save()});if(S.trk[t])toast('+5 XP');return}
  if(e.target.closest('#finish')){keep(()=>{S.done[S.cur]=today();save()});toast('Урок пройден! +50 XP');return}
  const rd=e.target.closest('[data-read]');if(rd){openReader(+rd.dataset.read);return}
  if(e.target.closest('#readerClose')){closeReader();return}
  const rdd=e.target.closest('[data-readdone]');if(rdd){S.read[rdd.dataset.readdone]=true;save();closeReader();keep(()=>{});toast('+20 XP');return}
  if(e.target.closest('#bookDel')){BOOK=null;DOC=null;idbSet(null);keep(()=>{});toast('Книга отключена');return}
  if(e.target.id==='reset1'){$('reset2').hidden=false;return}
  if(e.target.id==='resetNo'){$('reset2').hidden=true;return}
  if(e.target.id==='resetYes'){S={done:{},ans:{},quiz:{},life:{},read:{},sc:[],trk:{},free:S.free,offset:S.offset,tab:'home',cur:0,modf:'all',start:today()};save();render();toast('Всё сброшено');return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.ans!==undefined){const i=t.dataset.ans;S.ans[i]=S.ans[i]||{};S.ans[i][t.dataset.k]=t.value;save();refreshReq()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.life!==undefined){S.life[t.dataset.life]=t.checked;save();refreshReq()}
  if(t.dataset.readchk!==undefined){S.read[t.dataset.readchk]=t.checked;save();refreshReq();if(t.checked)toast('+20 XP')}
  if(t.dataset.bookin!==undefined&&t.files&&t.files[0]){toast('Подключаю книгу…');setBook(t.files[0]).then(()=>{keep(()=>{});toast('Книга подключена')}).catch(()=>toast('Не удалось прочитать файл'))}
  if(t.id==='offsetIn'){const v=parseInt(t.value,10);S.offset=isNaN(v)?1:v;save();toast('Сдвиг сохранён')}
  if(t.id==='freeMode'){S.free=t.checked;save();toast(S.free?'Свободный режим включён':'Один урок в день')}
});
document.addEventListener('submit',e=>{if(e.target.id==='scForm'){e.preventDefault();const v=$('scIn').value.trim();if(!v)return;keep(()=>{S.sc.push({t:v,v:'='});save()});const inp=$('scIn');if(inp)inp.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('reader').hidden)closeReader()});
addEventListener('resize',()=>{clearTimeout(dots.t);dots.t=setTimeout(dots,150)});
render();
idbGet().then(b=>{if(b&&b.buf){BOOK=b;render()}});
</script>

</body>
</html>
